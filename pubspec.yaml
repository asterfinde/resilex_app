name: resilex_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  # Receipt Parser - Paquete compartido para OCR y parsing
  receipt_parser:
    path: ../packages/receipt_parser

  # Image picker para seleccionar im\u00e1genes
  image_picker: ^1.0.7

  # Para compartir archivos CSV
  share_plus: ^10.0.3

  # Para guardar archivos en el dispositivo
  path_provider: ^2.1.5

  # Para generar CSV
  csv: ^6.0.0

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
